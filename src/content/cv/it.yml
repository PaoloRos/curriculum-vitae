intro:
  - Sono laureato in ingegneria industriale e nutro un particolare interesse per l’analisi dei dati e lo sviluppo software.
  - Nel tempo libero pratico diversi sport, preferibilmente a contatto con la natura. Mi dedico inoltre alla lettura di testi su argomenti diversi e ascolto volentieri rock classico e jazz. Mi piace viaggiare per conoscere nuovi luoghi e culture.

sections:
  - id: istruzione
    title: Istruzione
    entries:
      - heading: Laurea in Ingegneria industriale
        meta: Università di Trento · marzo 2026 · conseguita in corso nella sessione dell’a.a. 2024/25
        paragraphs:
          - Laurea triennale di classe L-9, indirizzo Sistemi, conseguita con votazione 100/110.
          - Dopo la laurea sono stati anticipati alcuni corsi del corso di laurea magistrale in ingegneria meccatronica in vista dell'iscrizione prevista per settembre 2026.
      - heading: Diploma di maturità classica
        meta: I.I.S.S. Gandhi, Merano · 2022
        paragraphs:
          - Diploma EQF livello 4, conseguito con votazione 90/100.
  - id: esperienze-lavorative
    title: Esperienze lavorative
    entries:
      - heading: Educatore di italiano e inglese
        meta: We For You · luglio 2024
        paragraphs:
          - Attività educative rivolte a bambini di madrelingua tedesca.
        annex_ids: [esperienza-we-for-you]
      - heading: Attività stagionale nella raccolta delle mele
        meta: Autunno 2022
        paragraphs:
          - Esperienza nel settore della coltivazione di pomacee e frutta a nocciolo.
      - heading: Esperienze nella ristorazione
        meta: 2020–2023
        paragraphs:
          - Esperienze nel servizio di ristorazione e nella vendita al pubblico presso McDonald’s e la Gelateria Oasi di Merano.
        annex_ids: [esperienza-ristorazione-2020, esperienza-ristorazione-2021, esperienza-gelateria-2023]
  - id: progetti-formativi
    title: Progetti formativi
    entries:
      - heading: Learning in Plurality — Lernen in der Vielfalt
        meta: Erasmus+ · 2017–2020
        paragraphs:
          - Progetto formativo europeo svoltosi in Austria, Germania e Romania.
  - id: volontariato
    title: Volontariato
    entries:
      - heading: Corpo dei Vigili del Fuoco Volontari di Maia Bassa
        meta: Dal 2021
        paragraphs:
          - Membro attivo con grado di servizio Feuerwehrmann, vigile del fuoco semplice.
      - heading: AVIS Comunale di Merano e Burgraviato ODV
        meta: Dal 2022
        paragraphs:
          - Socio donatore effettivo.
  - id: sport
    title: Carriera sportiva agonistica
    entries:
      - heading: Atletica leggera
        paragraphs:
          - Mezzofondista con partecipazioni a competizioni di livello nazionale; attualmente tesserato presso Merano Atletica Running.
        annex_ids: [carriera-atletica]
      - heading: Hockey su ghiaccio
        paragraphs:
          - Attività svolta durante l’adolescenza presso HC Merano Junior.
  - id: corsi
    title: Corsi e certificazioni
    entries:
      - heading: Formazione per vigili del fuoco
        paragraphs:
          - >-
            Corsi frequentati presso la Scuola provinciale antincendio dell’Alto Adige,
            tra cui: pronto soccorso, Gruppo A (16 h, 2024); addetti antincendio,
            livello basso (4 h, 2021); corso autorespiratori (2021).
      - heading: Salute e sicurezza sul lavoro
        paragraphs:
          - Formazione generale per lavoratori e lavoratrici (4 h, 2020) e formazione specifica per rischio medio (2022).
      - heading: Advanced Open Water Diver
        meta: "2022"
        paragraphs:
          - Brevetto subacqueo con abilitazione a immersioni fino a 30 m di profondità.
  - id: competenze
    title: Competenze e lingue
    entries:
      - heading: Lingue
        bullets:
          - Inglese tecnico di livello B2, certificato dall’Università di Trento; uso quotidiano dell’inglese in ambito ingegneristico e potenziamento in corso verso il livello C1 generale.
          - Tedesco utilizzato nella vita quotidiana.
        annex_ids: [certificazione-linguistica]
      - heading: Competenze informatiche
        bullets:
          - Fondamenti di C/C++ e R.
          - Fondamenti di MATLAB/Simulink e Wolfram Mathematica.
          - Automazione d’ufficio e strumenti digitali di uso generale.
annexes:
  - id: esperienza-ristorazione-2020
    number: 1
    title: Esperienza lavorativa 2020 presso McDonald’s di Merano
    paragraphs:
      - Tirocinante addetto al servizio di ristorazione. Le responsabilità comprendevano il servizio e l’assistenza ai clienti, la preparazione dei tavoli e il servizio di pietanze e bevande.
  - id: esperienza-ristorazione-2021
    number: 2
    title: Esperienza lavorativa 2021 presso McDonald’s di Merano
    paragraphs:
      - Ruolo di crew con mansioni operative connesse al servizio di ristorazione.
  - id: esperienza-gelateria-2023
    number: 3
    title: Esperienza lavorativa 2023 presso la Gelateria Oasi di Merano
    paragraphs:
      - Attività di servizio al banco e vendita del gelato ai clienti.
  - id: carriera-atletica
    number: 5
    title: Carriera di atletica leggera
    paragraphs:
      - Partecipazione a quattro campionati italiani su pista e a tre campionati italiani di corsa campestre.
  - id: esperienza-we-for-you
    number: 6
    title: Esperienza lavorativa presso We For You nel 2024
    paragraphs:
      - Educatore incaricato di favorire la conversazione in italiano e inglese con bambini di madrelingua tedesca tra i 9 e i 12 anni, attraverso lezioni frontali e attività ludico-ricreative.
  - id: certificazione-linguistica
    number: 7
    title: Certificazione linguistica
    paragraphs:
      - Livello B2 di inglese specialistico certificato dal Centro Linguistico di Ateneo dell’Università di Trento.
